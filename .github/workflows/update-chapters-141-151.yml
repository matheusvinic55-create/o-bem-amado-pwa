name: Atualizar capítulos 141 a 151

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-chapters-141-151.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Atualizar Diário de Sucupira e Gabinete
        shell: python
        run: |
          import re
          from pathlib import Path

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          html = html.replace('Capítulos 121 a 140.', 'Capítulos 141 a 151.')
          html = html.replace(
              'Acompanhe por arcos de capítulos. O material para exatamente no 140, sem atravessar a margem dos spoilers.',
              'Acompanhe por arcos de capítulos. O material para exatamente no 151, sem atravessar a margem dos spoilers.'
          )
          html = html.replace('capítulo 140', 'capítulo 151')

          new_chapters = """  const summaries=[
          [141,'08/08/1973','Gisa liga para Jairo para saber como ele está. Maestro Sabiá declara seu amor por Judicéia, Zelão tem uma visão e Juarez decide enfrentar a proibição do uso da fonte.'],
          [142,'09/08/1973','Juarez bebe água da fonte, incentiva o povo a fazer o mesmo e acaba espancado por jagunços do prefeito. Jaciara pede a Mestre Ambrósio que não revele um segredo a Zeca Diabo.'],
          [143,'10/08/1973','Zeca Diabo agride a irmã. Odorico descobre que a água da fonte é radioativa e, ao lado de Dirceu, continua espionando as confissões da igreja. Juarez e Telma constroem uma asa para Zelão.'],
          [144,'13/08/1973','Odorico e Dirceu ouvem a confissão de Emiliano Medrado sobre o sumiço do corpo. O prefeito atiça a rivalidade entre Cajazeiras e Medrados e promete ajudar os pescadores.'],
          [145,'14/08/1973','Cecéu volta a Sucupira. Cajazeiras e Medrados caem na armadilha de Odorico, Donana manda soldados vigiarem os Cajazeiras e Zeca Diabo vai à casa do coronel.'],
          [146,'15/08/1973','Hilário Cajazeira pede a Zeca Diabo que mate Emiliano Medrado. Cecéu dá uma surra em Jairo, enquanto os coronéis Medrado e Cajazeira ficam frente a frente.'],
          [147,'16/08/1973','A tensão aumenta em Sucupira. Dirceu se choca com os planos de Odorico, o prefeito faz uma proposta a Zeca Diabo e Anita procura Neco, com quem acaba se beijando.'],
          [148,'17/08/1973','Odorico escuta as confissões da própria irmã. Zeca Diabo se prepara para colocar em prática o plano do prefeito, Dirceu desabafa com Juarez e Telma se desentende com o médico.'],
          [149,'20/08/1973','Zeca Diabo espanca o filho do Coronel Cajazeira. Doutor Leão alerta Hilário sobre as armações de Odorico, e o coronel procura o prefeito jurando vingança contra os Medrado.'],
          [150,'21/08/1973','Coronel Cajazeira faz uma proposta a Zeca Diabo. Os coronéis Medrado e Cajazeira se enfrentam, enquanto Padre Honório descobre quem está escutando as confissões.'],
          [151,'22/08/1973','A população fica aterrorizada com a guerra entre Medrados e Cajazeiras. Zeca Diabo tenta convencer Odorico a encerrar o confronto, e Emiliano Medrado é baleado.']];
          const arcs=[[141,145,'141–145 · Fonte e armadilhas'],[146,151,'146–151 · Guerra em Sucupira']];let activeArc=0;"""

          pattern = re.compile(r"  const summaries=\[[\s\S]*?\n  const arcs=\[\[121,126,[\s\S]*?\]\];let activeArc=0;")
          html, count = pattern.subn(new_chapters, html, count=1)
          if count != 1:
              raise SystemExit('Bloco antigo de capítulos não encontrado em index.html')
          index_path.write_text(html, encoding='utf-8')

          api_path = Path('api/odorico.js')
          api = api_path.read_text(encoding='utf-8')
          api = api.replace('somente até o capítulo 140.', 'somente até o capítulo 151.')
          api = api.replace('posteriores ao capítulo 140', 'posteriores ao capítulo 151')
          api = api.replace('importância até o capítulo 140', 'importância até o capítulo 151')

          new_api_chapters = """- Capítulo 141: Gisa liga para Jairo para saber como ele está. Maestro Sabiá declara seu amor por Judicéia, Zelão tem uma visão e Juarez decide enfrentar a proibição do uso da fonte.
          - Capítulo 142: Juarez bebe água da fonte, incentiva o povo a fazer o mesmo e acaba espancado por jagunços do prefeito. Jaciara pede a Mestre Ambrósio que não revele um segredo a Zeca Diabo.
          - Capítulo 143: Zeca Diabo agride a irmã. Odorico descobre que a água da fonte é radioativa e, ao lado de Dirceu, continua espionando as confissões da igreja. Juarez e Telma constroem uma asa para Zelão.
          - Capítulo 144: Odorico e Dirceu ouvem a confissão de Emiliano Medrado sobre o sumiço do corpo. O prefeito atiça a rivalidade entre Cajazeiras e Medrados e promete ajudar os pescadores.
          - Capítulo 145: Cecéu volta a Sucupira. Cajazeiras e Medrados caem na armadilha de Odorico, Donana manda soldados vigiarem os Cajazeiras e Zeca Diabo vai à casa do coronel.
          - Capítulo 146: Hilário Cajazeira pede a Zeca Diabo que mate Emiliano Medrado. Cecéu dá uma surra em Jairo, enquanto os coronéis Medrado e Cajazeira ficam frente a frente.
          - Capítulo 147: A tensão aumenta em Sucupira. Dirceu se choca com os planos de Odorico, o prefeito faz uma proposta a Zeca Diabo e Anita procura Neco, com quem acaba se beijando.
          - Capítulo 148: Odorico escuta as confissões da própria irmã. Zeca Diabo se prepara para colocar em prática o plano do prefeito, Dirceu desabafa com Juarez e Telma se desentende com o médico.
          - Capítulo 149: Zeca Diabo espanca o filho do Coronel Cajazeira. Doutor Leão alerta Hilário sobre as armações de Odorico, e o coronel procura o prefeito jurando vingança contra os Medrado.
          - Capítulo 150: Coronel Cajazeira faz uma proposta a Zeca Diabo. Os coronéis Medrado e Cajazeira se enfrentam, enquanto Padre Honório descobre quem está escutando as confissões.
          - Capítulo 151: A população fica aterrorizada com a guerra entre Medrados e Cajazeiras. Zeca Diabo tenta convencer Odorico a encerrar o confronto, e Emiliano Medrado é baleado."""

          api_pattern = re.compile(r"- Capítulo 121:[\s\S]*?- Capítulo 140:[^\n]*")
          api, api_count = api_pattern.subn(new_api_chapters, api, count=1)
          if api_count != 1:
              raise SystemExit('Bloco antigo de capítulos não encontrado em api/odorico.js')
          api_path.write_text(api, encoding='utf-8')

          sw = """const CACHE='sucupira-v40';
          const CORE=['/','/index.html','/buzios','/buzios/','/buzios/index.html','/manifest.webmanifest','/assets/capa-sucupira.webp','/assets/personagens/zeca-diabo.svg','/assets/personagens/dr-juarez.svg','/assets/personagens/telma.svg','/assets/personagens/donana.svg','/assets/personagens/gisa.svg','/assets/personagens/ceceu.svg','/assets/personagens/zora.svg','/icons/icon-192.png','/icons/icon-512.png'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET'||new URL(e.request.url).pathname.startsWith('/api/'))return;e.respondWith(fetch(e.request).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match('/index.html'))))});
          """
          Path('sw.js').write_text(sw, encoding='utf-8')

      - name: Publicar alterações no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html api/odorico.js sw.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Atualiza Diário e Gabinete para capítulos 141 a 151"
          git push origin main
